<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Server - Page Not Found</title>
    <link rel="stylesheet" href="/assets/css/home.css" th:href="@{/assets/css/home.css}" />
    <style>
        .error-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: rgba(255, 80, 80, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-icon svg {
            color: #ff5050;
        }
        .error-code {
            font-size: 64px;
            font-weight: 700;
            color: rgba(160, 176, 200, 0.1);
            line-height: 1;
            margin-bottom: -8px;
        }
    </style>
</head>

<body>
    <div class="background-grid"></div>
    <div class="background-gradient"></div>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="home-container">
        <header class="home-header">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>Vekstorm OAuth2 Server</h1>
                    <p>Secure Authorization Platform</p>
                </div>
            </div>
        </header>

        <div class="status-card" style="text-align: center; padding: 48px 32px;">
            <div class="error-code">404</div>
            <div class="error-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
            </div>
            <div class="status-content">
                <h3>Page Not Found</h3>
                <p style="color: rgba(160, 176, 200, 0.7);">The page you are looking for does not exist or has been moved.</p>
            </div>

            <a href="/login" class="action-button primary" style="display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Back to Login</span>
            </a>
        </div>

        <footer class="home-footer">
            <p>OAuth2 Authorization Server v1.0 &bull; Vekstrom</p>
        </footer>
    </div>
</body>

</html>
