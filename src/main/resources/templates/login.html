<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authorization Server</title>
    <link rel="stylesheet" href="/assets/css/login.css" th:href="@{/assets/css/login.css}" />
</head>

<body>
    <div class="background-gradient"></div>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-circle">VEKSTORM</div>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn" id="tab-signin" data-tab="signin" onclick="switchTab('signin')">Sign In</button>
                <button class="tab-btn" id="tab-signup" data-tab="signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <div th:if="${param.error}" class="alert alert-error">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                <span>Invalid username or password</span>
            </div>

            <div th:if="${param.registered}" class="alert alert-success">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Account created successfully. Please sign in.</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                <span>You have been logged out successfully</span>
            </div>

            <div th:if="${regError}" class="alert alert-error">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                <span th:text="${regError}">Registration error</span>
            </div>

            <form class="auth-form" id="signin-form" method="post" th:action="@{/login}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span>Sign In</span>
                </button>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-buttons">
                    <a href="/oauth2/authorization/google-idp" class="btn btn-social">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#EA4335" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#4285F4" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#34A853" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span>Google</span>
                    </a>
                </div>
            </form>

            <form class="auth-form" id="signup-form" method="post" th:action="@{/register}">
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="reg-username" name="username" placeholder="Choose a username" required minlength="3" th:value="${regUsername}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="reg-email" name="email" placeholder="Enter your email" required th:value="${regEmail}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="reg-password" name="password" placeholder="Create a password" required minlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="reg-confirm" name="confirmPassword" placeholder="Confirm your password" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span>Create Account</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        var activeTab = /*[[${regMode != null ? 'signup' : 'signin'}]]*/ 'signin';

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.querySelectorAll('.auth-form').forEach(function(form) {
                form.classList.toggle('active', form.id === tab + '-form');
            });
            var input = document.querySelector('#' + tab + '-form .input-wrapper input');
            if (input) setTimeout(function() { input.focus(); }, 300);
        }

        switchTab(activeTab);
    </script>
</body>

</html>
